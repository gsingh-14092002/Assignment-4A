<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Tours</title>
    <!-- link to Bootstrap files via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- link to Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand text-uppercase" href="#">AuroraTours</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">Packages</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">FAQ</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- carousel -->

<div id="hero-carousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#hero-carousel"
      data-bs-slide-to="0"
      class="active"
      aria-current="true"
      aria-label="Slide 1"
    ></button>

    <button
      type="button"
      data-bs-target="#hero-carousel"
      data-bs-slide-to="1"
      aria-label="Slide 2"
    ></button>

    <button
      type="button"
      data-bs-target="#hero-carousel"
      data-bs-slide-to="2"
      aria-label="Slide 3"
    ></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active c-item">
      <img
        src="https://images.unsplash.com/photo-1579033461380-adb47c3eb938"
        class="d-block w-100 c-img"
        alt="Northern lights over mountains"
      />

      <div class="carousel-caption top-0 mt-4">
        <p class="fs-3 mt-5 text-uppercase">
          Discover the hidden world
        </p>

        <h1 class="display-1 fw-bolder text-capitalize">
          The Aurora Tours
        </h1>

        <button
          class="btn btn-primary px-4 py-2 fs-5 mt-5"
          data-bs-toggle="modal"
          data-bs-target="#booking-modal"
        >
          Book a tour
        </button>
      </div>
    </div>

    <div class="carousel-item c-item">
      <img
        src="https://images.unsplash.com/photo-1516466723877-e4ec1d736c8a"
        class="d-block w-100 c-img"
        alt="Northern lights in winter"
      />

      <div class="carousel-caption top-0 mt-4">
        <p class="fs-3 mt-5 text-uppercase">
          The season has arrived
        </p>

        <h1 class="display-1 fw-bolder text-capitalize">
          3 available tours
        </h1>

        <button
          class="btn btn-primary px-4 py-2 fs-5 mt-5"
          data-bs-toggle="modal"
          data-bs-target="#booking-modal"
        >
          Book a tour
        </button>
      </div>
    </div>

    <div class="carousel-item c-item">
      <img
        src="https://images.unsplash.com/photo-1612686635542-2244ed9f8ddc"
        class="d-block w-100 c-img"
        alt="Aurora travel destination"
      />

      <div class="carousel-caption top-0 mt-4">
        <p class="fs-3 mt-5 text-uppercase">
          Destination activities
        </p>

        <h1 class="display-1 fw-bolder text-capitalize">
          Go glacier hiking
        </h1>

        <button
          class="btn btn-primary px-4 py-2 fs-5 mt-5"
          data-bs-toggle="modal"
          data-bs-target="#booking-modal"
        >
          Book a tour
        </button>
      </div>
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#hero-carousel"
    data-bs-slide="prev"
  >
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>

  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#hero-carousel"
    data-bs-slide="next"
  >
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
  
<div
  class="modal fade"
  id="booking-modal"
  tabindex="-1"
  aria-labelledby="booking-modal-label"
  aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title" id="booking-modal-label">Book a tour</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close">
        </button>
      </div>

      <div class="modal-body">
        <form action="#">
          <div class="row g-2">
            <div class="col-sm-6">
              <div class="form-floating">
                <input
                  id="email1"
                  type="email"
                  class="form-control"
                  placeholder="Email address"
                />
                <label for="email1">Email address</label>
              </div>
            </div>

      <div class="col-sm-6">
          <div class="form-floating">
              <select id="select1" class="form-select">
                  <option>Tromso, Norway - $899</option>
                  <option>Reykjavik, Iceland - $799</option>
                  <option>Yukon, Canada - $849</option>
                </select>
                <label for="select1">Pick a tour</label>
              </div>
            </div>
          </div>
        </form>
      </div>

    <div class="modal-footer">
        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Close
        </button>
        <button type="button" class="btn btn-primary">
          Checkout
        </button>
      </div>
    </div>
  </div>
</div>
    


    <!-- link to BootStrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
